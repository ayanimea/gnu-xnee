name: Enterprise Linux 8 CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-package-el8:
    name: Build and package on Enterprise Linux 8
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: almalinux:8

    steps:
      - name: Enable PowerTools and install build dependencies
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled powertools
          dnf install -y \
            gcc \
            make \
            autoconf \
            automake \
            libtool \
            pkgconfig \
            libX11-devel \
            libX11-static \
            libXtst-devel \
            libXtst-static \
            libXext-devel \
            libxcb-devel \
            libXau-devel \
            libXdmcp-devel \
            texinfo \
            rpm-build \
            git

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Build XNee
        run: |
          make -f Makefile.cvs generate
          ./configure --disable-gui --disable-doc --disable-xinput2
          make
          make -C cnee/src man
          # Re-link cnee as a fully static binary so it runs on any EL8 system
          # without requiring runtime X11 libraries.
          # (libtool strips -static when linking system libs, so we bypass it here.)
          LIBDIR=$(pkg-config --variable=libdir x11)
          gcc -o cnee/src/cnee \
            cnee/src/cnee_fake.o cnee/src/cnee_printer.o cnee/src/cnee_strings.o \
            cnee/src/cnee_demo.o cnee/src/main.o cnee/src/parse.o \
            -Wl,-Bstatic \
              libxnee/src/.libs/libxnee.a \
              "${LIBDIR}/libX11.a" \
              "${LIBDIR}/libXtst.a" \
              "${LIBDIR}/libXext.a" \
              "${LIBDIR}/libxcb.a" \
              "${LIBDIR}/libXau.a" \
              "${LIBDIR}/libXdmcp.a" \
            -Wl,-Bdynamic -lpthread -ldl

      - name: Run e2e tests
        run: |
          chmod +x tests/e2e_cnee.sh
          ./tests/e2e_cnee.sh ./cnee/src/cnee

      - name: Create source distribution
        run: |
          XNEE_VERSION=$(grep 'AC_INIT' configure.in \
            | awk 'BEGIN {FS=","} { print $2 }' \
            | tr -d ' ')
          # Use git archive to avoid the doc/Makefile.am dia→png generation
          # that make dist triggers even with --disable-doc.
          git archive --prefix="Xnee-${XNEE_VERSION}/" HEAD \
            | gzip > "Xnee-${XNEE_VERSION}.tar.gz"

      - name: Build RPM package
        run: |
          XNEE_VERSION=$(grep 'AC_INIT' configure.in \
            | awk 'BEGIN {FS=","} { print $2 }' \
            | tr -d ' ')
          XNEE_RELEASE=1

          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cp "Xnee-${XNEE_VERSION}.tar.gz" "$HOME/rpmbuild/SOURCES/"

          sed \
            -e "s/XNEE_VERSION/${XNEE_VERSION}/g" \
            -e "s/XNEE_RELEASE/${XNEE_RELEASE}/g" \
            build/SPECS/cnee-el8.spec \
            > "$HOME/rpmbuild/SPECS/cnee.spec"

          rpmbuild -ba "$HOME/rpmbuild/SPECS/cnee.spec"

          # Copy built RPMs to the workspace for artifact upload
          find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp {} . \;

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnee-el8-rpm
          path: "*.rpm"
          if-no-files-found: error
